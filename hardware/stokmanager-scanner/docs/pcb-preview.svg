<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <linearGradient id="fr4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5c3a"/>
      <stop offset="100%" stop-color="#0f3d26"/>
    </linearGradient>
    <linearGradient id="fr4b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#164a30"/>
      <stop offset="100%" stop-color="#0c301e"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#cfcfcf"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#2a2a2a" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1100" height="720" fill="#121417"/>
  <rect width="1100" height="720" fill="url(#grid)" opacity="0.35"/>

  <text x="550" y="42" text-anchor="middle" fill="#f0f0f0" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="700">
    StokManager Scanner — Compact Double-Sided PCB
  </text>
  <text x="550" y="70" text-anchor="middle" fill="#9ad4b0" font-family="Segoe UI, system-ui, sans-serif" font-size="15">
    rev 0.2-ds · 55 × 32 mm · 2-layer FR4 · TOP logic / BOTTOM power
  </text>

  <!-- ========== TOP BOARD ========== -->
  <g transform="translate(70,110)" filter="url(#shadow)">
    <!-- scale: 12 px per mm → 55*12=660, 32*12=384 -->
    <rect x="0" y="0" width="660" height="384" rx="10" fill="url(#fr4)" stroke="#3d8f62" stroke-width="3"/>

    <!-- mounting holes -->
    <circle cx="36" cy="36" r="10" fill="#0a0a0a" stroke="#888" stroke-width="1.5"/>
    <circle cx="624" cy="36" r="10" fill="#0a0a0a" stroke="#888" stroke-width="1.5"/>
    <circle cx="36" cy="348" r="10" fill="#0a0a0a" stroke="#888" stroke-width="1.5"/>
    <circle cx="624" cy="348" r="10" fill="#0a0a0a" stroke="#888" stroke-width="1.5"/>

    <!-- copper pour hint -->
    <rect x="18" y="18" width="624" height="348" rx="6" fill="#1f6b44" opacity="0.35"/>

    <!-- antenna keepout -->
    <rect x="48" y="70" width="130" height="80" rx="4" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="113" y="115" text-anchor="middle" fill="#ffb4b4" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">ANT</text>
    <text x="113" y="132" text-anchor="middle" fill="#ffb4b4" font-family="Segoe UI, sans-serif" font-size="11">KEEP-OUT</text>

    <!-- ESP32 DevKit -->
    <g transform="translate(55,155)">
      <rect width="250" height="175" rx="6" fill="#1a1a1e" stroke="#555" stroke-width="2"/>
      <rect x="8" y="8" width="234" height="120" rx="4" fill="#0d0d10" stroke="#333"/>
      <!-- chip -->
      <rect x="70" y="30" width="90" height="70" rx="3" fill="#2a2a30" stroke="#666"/>
      <text x="115" y="70" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">ESP32</text>
      <!-- USB -->
      <rect x="-18" y="70" width="22" height="36" rx="2" fill="#c0c0c0" stroke="#888"/>
      <text x="125" y="155" text-anchor="middle" fill="#ddd" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">ESP32-DevKit (TOP)</text>
      <text x="125" y="170" text-anchor="middle" fill="#888" font-family="Segoe UI, sans-serif" font-size="10">USB ← left edge</text>
      <!-- pin rows -->
      <g fill="#d4af37">
        <rect x="5" y="8" width="6" height="155" rx="1"/>
        <rect x="239" y="8" width="6" height="155" rx="1"/>
      </g>
    </g>

    <!-- OLED -->
    <g transform="translate(340,70)">
      <rect width="175" height="110" rx="5" fill="#0a0a0a" stroke="#444" stroke-width="2"/>
      <rect x="10" y="12" width="155" height="70" rx="2" fill="#050505" stroke="#1a3a2a"/>
      <text x="87" y="52" text-anchor="middle" fill="#2ecc71" font-family="monospace" font-size="12" opacity="0.7">128×64</text>
      <text x="87" y="98" text-anchor="middle" fill="#ddd" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">OLED I2C</text>
      <!-- 4 pins -->
      <g fill="#ccc">
        <circle cx="40" cy="105" r="3"/><circle cx="70" cy="105" r="3"/>
        <circle cx="100" cy="105" r="3"/><circle cx="130" cy="105" r="3"/>
      </g>
    </g>

    <!-- Buttons -->
    <g transform="translate(340,210)">
      <g>
        <rect x="0" y="0" width="48" height="48" rx="6" fill="#2c2c32" stroke="#777"/>
        <circle cx="24" cy="24" r="12" fill="#3a3a42" stroke="#999"/>
        <text x="24" y="68" text-anchor="middle" fill="#ccc" font-family="Segoe UI, sans-serif" font-size="12">UP</text>
        <text x="24" y="82" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">GPIO32</text>
      </g>
      <g transform="translate(60,0)">
        <rect x="0" y="0" width="48" height="48" rx="6" fill="#2c2c32" stroke="#777"/>
        <circle cx="24" cy="24" r="12" fill="#3a3a42" stroke="#999"/>
        <text x="24" y="68" text-anchor="middle" fill="#ccc" font-family="Segoe UI, sans-serif" font-size="12">OK</text>
        <text x="24" y="82" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">GPIO33</text>
      </g>
      <g transform="translate(120,0)">
        <rect x="0" y="0" width="48" height="48" rx="6" fill="#2c2c32" stroke="#777"/>
        <circle cx="24" cy="24" r="12" fill="#3a3a42" stroke="#999"/>
        <text x="24" y="68" text-anchor="middle" fill="#ccc" font-family="Segoe UI, sans-serif" font-size="12">DN</text>
        <text x="24" y="82" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">GPIO25</text>
      </g>
    </g>

    <!-- ADC divider SMD -->
    <g transform="translate(340,320)">
      <rect width="22" height="10" rx="1" fill="#2a1f0a" stroke="#c9a227"/>
      <rect x="30" width="22" height="10" rx="1" fill="#2a1f0a" stroke="#c9a227"/>
      <rect x="60" width="16" height="10" rx="1" fill="#1a2a1a" stroke="#6a9"/>
      <text x="90" y="9" fill="#bbb" font-family="monospace" font-size="10">R1 R2 C1 → GPIO34</text>
    </g>

    <!-- GM67 connector -->
    <g transform="translate(560,70)">
      <rect width="70" height="130" rx="4" fill="#1e1e24" stroke="#666" stroke-width="2"/>
      <text x="35" y="30" text-anchor="middle" fill="#ddd" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">GM67</text>
      <text x="35" y="48" text-anchor="middle" fill="#888" font-family="Segoe UI, sans-serif" font-size="9">header</text>
      <g fill="#d4af37">
        <circle cx="35" cy="70" r="4"/>
        <circle cx="35" cy="90" r="4"/>
        <circle cx="35" cy="110" r="4"/>
      </g>
      <text x="35" y="150" text-anchor="middle" fill="#7fdb9a" font-family="monospace" font-size="9">TX/RX</text>
    </g>

    <!-- scale bar -->
    <line x1="480" y1="360" x2="600" y2="360" stroke="#9ad4b0" stroke-width="2"/>
    <line x1="480" y1="355" x2="480" y2="365" stroke="#9ad4b0" stroke-width="2"/>
    <line x1="600" y1="355" x2="600" y2="365" stroke="#9ad4b0" stroke-width="2"/>
    <text x="540" y="352" text-anchor="middle" fill="#9ad4b0" font-family="monospace" font-size="11">10 mm</text>
  </g>

  <text x="400" y="520" text-anchor="middle" fill="#f0f0f0" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">TOP (component / UI side)</text>

  <!-- ========== BOTTOM BOARD (smaller preview side by side conceptually - place right) ========== -->
  <g transform="translate(780,130)" filter="url(#shadow)">
    <!-- same physical size scaled down a bit for side panel: use 0.45 scale of top? Better fixed smaller -->
    <!-- 55*7=385, 32*7=224 -->
    <rect x="0" y="0" width="280" height="163" rx="8" fill="url(#fr4b)" stroke="#3d8f62" stroke-width="2"/>
    <rect x="8" y="8" width="264" height="147" rx="4" fill="#165234" opacity="0.4"/>

    <text x="140" y="22" text-anchor="middle" fill="#e0e0e0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">BOTTOM (power side)</text>

    <!-- TP4056 -->
    <g transform="translate(18,36)">
      <rect width="110" height="55" rx="3" fill="#1565c0" stroke="#90caf9" stroke-width="1.5"/>
      <text x="55" y="22" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">TP4056</text>
      <text x="55" y="38" text-anchor="middle" fill="#bbdefb" font-family="Segoe UI, sans-serif" font-size="9">charge</text>
      <rect x="-8" y="18" width="12" height="20" rx="1" fill="#c0c0c0"/>
    </g>

    <!-- Boost -->
    <g transform="translate(150,36)">
      <rect width="110" height="55" rx="3" fill="#6a1b9a" stroke="#ce93d8" stroke-width="1.5"/>
      <text x="55" y="22" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">MT3608</text>
      <text x="55" y="38" text-anchor="middle" fill="#e1bee7" font-family="Segoe UI, sans-serif" font-size="9">boost → 5.0V</text>
    </g>

    <!-- Battery -->
    <g transform="translate(40,105)">
      <rect width="200" height="42" rx="4" fill="#37474f" stroke="#90a4ae" stroke-width="1.5"/>
      <rect x="8" y="8" width="14" height="26" rx="1" fill="#ffb300"/>
      <text x="110" y="20" text-anchor="middle" fill="#eceff1" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Li-Po 3.7V (flat)</text>
      <text x="110" y="35" text-anchor="middle" fill="#90a4ae" font-family="monospace" font-size="9">JST-PH · double-sided tape</text>
    </g>
  </g>

  <text x="920" y="330" text-anchor="middle" fill="#f0f0f0" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">BOTTOM</text>
  <text x="920" y="350" text-anchor="middle" fill="#9ad4b0" font-family="Segoe UI, sans-serif" font-size="12">flip board · power stack</text>

  <!-- Stack section -->
  <g transform="translate(70,560)">
    <text x="0" y="0" fill="#f0f0f0" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Cross-section (simplified)</text>
    <!-- layers -->
    <rect x="0" y="20" width="960" height="28" rx="3" fill="#222" stroke="#555"/>
    <text x="480" y="39" text-anchor="middle" fill="#9ad4b0" font-family="Segoe UI, sans-serif" font-size="12">TOP: ESP32 · OLED · Buttons · ADC · GM67 header</text>

    <rect x="0" y="52" width="960" height="18" rx="2" fill="#1a5c3a" stroke="#3d8f62"/>
    <text x="480" y="65" text-anchor="middle" fill="#c8f0d8" font-family="Segoe UI, sans-serif" font-size="11">PCB core 1.2 mm · F.Cu + B.Cu GND pour · via stitch</text>

    <rect x="0" y="74" width="960" height="28" rx="3" fill="#1a1520" stroke="#555"/>
    <text x="480" y="93" text-anchor="middle" fill="#ce93d8" font-family="Segoe UI, sans-serif" font-size="12">BOTTOM: TP4056 · Boost 5V · Li-Po pouch</text>
  </g>

  <text x="550" y="705" text-anchor="middle" fill="#666" font-family="Segoe UI, sans-serif" font-size="11">
    Preview mockup · not a Gerber render · open stokmanager-scanner.kicad_pro for editable layout
  </text>
</svg>
